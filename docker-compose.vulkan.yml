services:
  mio-tts:
    image: ghcr.io/blue1st/mio-tts-cpp:vulkan-latest
    build:
      context: .
      dockerfile: Dockerfile.vulkan
    container_name: mio-tts-cpp-vulkan
    ports:
      - "18089:18089"
    devices:
      - "/dev/dri:/dev/dri"
    group_add:
      - video
      - render
    volumes:
      - ./models:/app/models
      - ./output:/tmp
    command: [
      "-mv", "models/miocodec.gguf",
      "-m", "models/MioTTS-0.1B-Q8_0.gguf",
      "--tts-wavlm-model", "models/wavlm_base_plus_2l_f32.gguf",
      "--reference-file-json", '[{"key":"jp_female","path":"models/jp_female.emb.gguf"},{"key":"jp_male","path":"models/jp_male.emb.gguf"}]',
      "--host", "0.0.0.0",
      "--port", "18089",
      "-ngl", "99",
      "--ctx-size", "700",
      "-n", "400",
      "--parallel", "2",
      "--threads", "4",
      "--output-dir", "/tmp"
    ]
    restart: unless-stopped
