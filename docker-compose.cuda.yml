services:
  mio-tts:
    image: ghcr.io/blue1st/mio-tts-cpp:cuda-latest
    build:
      context: .
      dockerfile: Dockerfile.cuda
    container_name: mio-tts-cpp-cuda
    ports:
      - "18089:18089"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./models:/app/models
      - ./output:/tmp
    environment:
      - CUDA_VISIBLE_DEVICES=0
    command: [
      "-mv", "models/miocodec.gguf",
      "-m", "models/MioTTS-0.1B-Q8_0.gguf",
      "--tts-wavlm-model", "models/wavlm_base_plus_2l_f32.gguf",
      "--reference-file-json", '[{"key":"jp_female","path":"models/jp_female.emb.gguf"},{"key":"jp_male","path":"models/jp_male.emb.gguf"}]',
      "--host", "0.0.0.0",
      "--port", "18089",
      "-ngl", "99",
      "--flash-attn", "on",
      "--ctx-size", "700",
      "-n", "400",
      "--parallel", "2",
      "--threads", "4",
      "--output-dir", "/tmp"
    ]
    restart: unless-stopped
