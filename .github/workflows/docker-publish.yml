name: Build and Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cpu
            file: ./Dockerfile.cpu
            tag_prefix: cpu
          - name: cuda
            file: ./Dockerfile.cuda
            tag_prefix: cuda
          - name: vulkan
            file: ./Dockerfile.vulkan
            tag_prefix: vulkan
          - name: rocm
            file: ./Dockerfile.rocm
            tag_prefix: rocm
            build_args: |
              UBUNTU_VERSION=22.04
              ROCM_VERSION=10.0.0-full

    permissions:
      contents: read
      packages: write

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.tag_prefix }}-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ matrix.tag_prefix }}-{{sha}},enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,prefix=${{ matrix.tag_prefix }}-
            type=semver,pattern={{version}},prefix=${{ matrix.tag_prefix }}-
            type=sha,prefix=${{ matrix.tag_prefix }}-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
